name: Publish daily memory verse

on:
  schedule:
    # Around midnight in Chicago (06:00 UTC in winter, 05:00 UTC in summer).
    # A second run two hours later catches days when the verse is posted late.
    - cron: "5 6 * * *"
    - cron: "5 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check, don't publish (1 = yes)"
        default: "0"
      for_date:
        description: "Date to look up (YYYY-MM-DD). Leave blank for today."
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-verse
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find and add today's verse
        id: verse
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FOR_DATE: ${{ github.event.inputs.for_date }}
        run: python scripts/publish_verse.py
      - name: Save to the website feed
        if: steps.verse.outputs.ref != ''
        run: |
          git config user.name "franciscaoganyaoroge"
          git config user.email "franciscaoganyaoroge@users.noreply.github.com"
          git add verses.json
          git diff --cached --quiet || git commit -m "Memory verse: ${{ steps.verse.outputs.ref }}"
          git push
